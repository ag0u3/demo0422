name: Build and Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (fetches MSFT stock + TWICE news, then next build)
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        run: npx -y @azure/static-web-apps-cli@latest deploy ./out --deployment-token "$DEPLOY_TOKEN" --env production
        env:
          DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
